# El Padel — PostgreSQL 16 tuning for a Raspberry Pi 4 with ~1.8 GiB RAM.
# Mounted as the active config_file. Keep fsync and synchronous_commit on.
#
# Starting points: shared_buffers ~7% of RAM, effective_cache_size ~28%,
# work_mem small so parallel sorts cannot OOM the host, max_connections
# headroom for API+worker pools (~10 each) plus admin/backup sessions.

data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

listen_addresses = '*'
port = 5432
max_connections = 40

shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB

wal_compression = on
checkpoint_timeout = 15min
max_wal_size = 1GB
min_wal_size = 80MB

fsync = on
synchronous_commit = on
full_page_writes = on

log_min_duration_statement = 500
log_timezone = 'UTC'

timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
