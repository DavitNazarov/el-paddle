# Replace app.example.com and api.example.com with your real domains.
# This file is intended for Ubuntu's /etc/nginx/sites-available/el-paddle.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Auth / bootstrap brute-force protection (per client IP).
limit_req_zone $binary_remote_addr zone=elpadel_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=elpadel_bootstrap:10m rate=5r/h;

upstream el_paddle_frontend {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream el_paddle_backend {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  server_tokens off;
  client_max_body_size 128k;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  listen 80;
  listen [::]:80;
  server_name app.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  server_tokens off;
  client_max_body_size 128k;
  listen 80;
  listen [::]:80;
  server_name api.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  server_tokens off;
  client_max_body_size 128k;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name app.example.com;

  ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	  add_header X-Content-Type-Options "nosniff" always;
	  add_header X-Frame-Options "DENY" always;
	  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
	  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://el_paddle_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}

server {
  server_tokens off;
  client_max_body_size 128k;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.example.com;

  ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	  add_header X-Content-Type-Options "nosniff" always;
	  add_header X-Frame-Options "DENY" always;
	  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
	  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Tight limits on high-value auth endpoints (app also rate-limits in-process).
  location = /api/auth/login {
    limit_req zone=elpadel_auth burst=5 nodelay;
    proxy_pass http://el_paddle_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/register {
    limit_req zone=elpadel_auth burst=5 nodelay;
    proxy_pass http://el_paddle_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/verify {
    limit_req zone=elpadel_auth burst=5 nodelay;
    proxy_pass http://el_paddle_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/admin/bootstrap {
    limit_req zone=elpadel_bootstrap burst=2 nodelay;
    proxy_pass http://el_paddle_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://el_paddle_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
