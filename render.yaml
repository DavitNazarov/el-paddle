# Production on Render. Domains are added in the dashboard, not here.
# The public URLs below are already the names you will attach:
#   elpadel-web  -> https://elpadell.com and https://www.elpadell.com
#   elpadel-api  -> https://api.elpadell.com
# Keep elpadel-api at one instance. Socket.IO runs in that process.

envVarGroups:
  - name: elpadel-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Set only to create the first admin, then delete it. Production refuses
      # to start while this is set and an admin already exists.
      - key: FIRST_ADMIN_BOOTSTRAP_TOKEN
        sync: false

databases:
  - name: elpadel-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: elpadel_prod
    user: elpadel_app
    ipAllowList: []

services:
  - type: web
    name: elpadel-api
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    preDeployCommand: npm run prisma:migrate:deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: elpadel-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://elpadell.com,https://www.elpadell.com
      - key: BACKEND_URL
        value: https://api.elpadell.com
      - key: GOOGLE_REDIRECT_URI
        value: https://api.elpadell.com/api/auth/google/callback
      - key: RUN_OUTBOX_IN_API
        value: "true"
      - fromGroup: elpadel-secrets

  - type: worker
    name: elpadel-worker
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    preDeployCommand: npm run prisma:migrate:deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: elpadel-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://elpadell.com,https://www.elpadell.com
      - key: BACKEND_URL
        value: https://api.elpadell.com
      - key: GOOGLE_REDIRECT_URI
        value: https://api.elpadell.com/api/auth/google/callback
      - fromGroup: elpadel-secrets

  - type: web
    name: elpadel-web
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://api.elpadell.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://elpadell.com
      - key: NEXT_PUBLIC_LEGAL_ENTITY_NAME
        sync: false
      - key: NEXT_PUBLIC_LEGAL_ENTITY_FORM
        sync: false
      - key: NEXT_PUBLIC_LEGAL_ENTITY_ID
        sync: false
      - key: NEXT_PUBLIC_LEGAL_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_LEGAL_EMAIL
        sync: false
      - key: NEXT_PUBLIC_LEGAL_PHONE
        sync: false
