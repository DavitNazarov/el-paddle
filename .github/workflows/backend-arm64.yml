# Build and push the backend image for linux/arm64 (Raspberry Pi) to GHCR.
# Does not deploy. Existing CI (ci.yml) is unchanged.
#
# Local alternative on Apple Silicon (native arm64, no push):
#   docker buildx build --platform linux/arm64 \
#     -f backend/Dockerfile -t ghcr.io/davitnazarov/elpadel-backend:local .

name: Backend arm64 image

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/backend-arm64.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: elpadel-backend
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SHA="${{ github.sha }}"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64
          provenance: false
